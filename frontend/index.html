<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Letter</title>
  <meta name="description" content="Take a photo of a confusing official letter. Get a plain-language explanation in your language, the deadline, and what to do next.">
  <meta name="theme-color" content="#ece9e4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icons (from Lucide, ISC license), used with <svg><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z"/><path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-shield-alert" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-lightbulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  </svg>

  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <p class="strip"><span data-i18n="strip_note">A free student project. Not a government website.</span></p>

  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="./" data-action="home">
        <svg class="icon brand-icon"><use href="#i-mail"/></svg>
        <span class="brand-name">Open Letter</span>
      </a>
      <button class="lang-pill" type="button" data-action="open-lang" aria-haspopup="dialog" data-i18n-attr="aria-label: choose_language">
        <svg class="icon icon-sm"><use href="#i-globe"/></svg>
        <span id="lang-current">English</span>
        <svg class="icon icon-sm"><use href="#i-chevron-down"/></svg>
      </button>
    </nav>
  </header>

  <main id="main" tabindex="-1">

    <!-- Home -->
    <section class="view" id="view-home">
      <div class="hero">
        <div class="wrap hero-center">
          <p class="label"><span class="dot"></span><span data-i18n="hero_eyebrow"></span></p>
          <h1 class="display"><span data-i18n="hero_title_a"></span> <span data-i18n="hero_title_b"></span></h1>
          <p class="lead" data-i18n="hero_sub"></p>
          <div class="hero-actions">
            <button class="btn btn-primary btn-lg" type="button" data-action="camera">
              <svg class="icon"><use href="#i-camera"/></svg><span data-i18n="take_photo"></span>
            </button>
            <button class="btn btn-secondary btn-lg" type="button" data-action="library">
              <svg class="icon"><use href="#i-image"/></svg><span data-i18n="choose_photos"></span>
            </button>
          </div>
        </div>

        <!-- Lines like text being scanned; a scan sweeps across them. The pill asks the app's question in every language. -->
        <div class="wrap">
          <div class="lines-panel">
            <svg class="lines" id="hero-lines" aria-hidden="true" preserveAspectRatio="none"></svg>
            <div class="ask">
              <p class="ask-text" aria-hidden="true"><span id="ask-text"></span><span class="caret"></span></p>
              <button class="ask-btn" type="button" data-action="example"><span data-i18n="see_example"></span><svg class="icon icon-sm flip-rtl"><use href="#i-chevron-right"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <section class="split" aria-labelledby="why-title">
        <div class="wrap split-grid">
          <h2 class="display-md" id="why-title" data-i18n="why_title"></h2>
          <div>
            <p class="label"><span class="dot"></span><span data-i18n="why_label"></span></p>
            <p class="split-body" data-i18n="why_body"></p>
          </div>
        </div>
      </section>

      <section class="constellation" aria-labelledby="types-title">
        <div class="wrap constellation-inner">
          <svg class="curves" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
            <path d="M160 140 C 300 60, 420 80, 500 300"/>
            <path d="M840 120 C 720 60, 600 120, 500 300"/>
            <path d="M120 420 C 260 470, 380 420, 500 300"/>
            <path d="M880 460 C 760 540, 620 480, 500 300"/>
            <path d="M500 40 C 520 120, 480 200, 500 300"/>
            <path d="M500 570 C 470 480, 530 400, 500 300"/>
          </svg>
          <div class="constellation-center">
            <h2 class="display-md" id="types-title" data-i18n="types_heading"></h2>
            <p data-i18n="types_sub"></p>
          </div>
          <ul class="nodes">
              <li class="node node-1"><span class="node-label" data-i18n="type_health"></span><span class="node-bars"></span></li>
              <li class="node node-2"><span class="node-label" data-i18n="type_food"></span></li>
              <li class="node node-3"><span class="node-label" data-i18n="type_tax"></span><span class="node-bars"></span></li>
              <li class="node node-4"><span class="node-label" data-i18n="type_housing"></span></li>
              <li class="node node-5"><span class="node-label" data-i18n="type_utility"></span><span class="node-bars"></span></li>
              <li class="node node-6"><span class="node-label" data-i18n="type_school"></span></li>
              <li class="node node-7"><span class="node-label" data-i18n="type_immigration"></span><span class="node-bars"></span></li>
              <li class="node node-8"><span class="node-label" data-i18n="type_medical"></span></li>
          </ul>
        </div>
      </section>

      <section class="how" aria-labelledby="how-title">
        <div class="wrap">
          <p class="label"><span class="dot"></span><span data-i18n="how_title" id="how-title"></span></p>
          <ol class="how-grid">
            <li class="how-card tone-sand"><span class="how-num">01</span><svg class="icon"><use href="#i-camera"/></svg><h3 data-i18n="how1_t"></h3><p data-i18n="how1_d"></p></li>
            <li class="how-card tone-lavender"><span class="how-num">02</span><svg class="icon"><use href="#i-quote"/></svg><h3 data-i18n="how2_t"></h3><p data-i18n="how2_d"></p></li>
            <li class="how-card tone-white"><span class="how-num">03</span><svg class="icon"><use href="#i-check-circle"/></svg><h3 data-i18n="how3_t"></h3><p data-i18n="how3_d"></p></li>
          </ol>
        </div>
      </section>

      <section class="trust" aria-labelledby="trust-title">
        <div class="wrap split-grid">
          <h2 class="display-md" id="trust-title" data-i18n="trust_title"></h2>
          <ol class="spec">
            <li><span class="spec-num">01</span><div><h3 data-i18n="trust1_t"></h3><p data-i18n="trust1_d"></p></div></li>
            <li><span class="spec-num">02</span><div><h3 data-i18n="trust2_t"></h3><p data-i18n="trust2_d"></p></div></li>
            <li><span class="spec-num">03</span><div><h3 data-i18n="trust3_t"></h3><p data-i18n="trust3_d"></p></div></li>
          </ol>
        </div>
      </section>

      <section class="dark-cta" aria-labelledby="cta-title">
        <div class="wrap dark-cta-inner">
          <p class="label label-light" data-i18n="cta_label"></p>
          <h2 class="display" id="cta-title" data-i18n="cta_title"></h2>
          <p class="dark-sub" data-i18n="cta_sub"></p>
          <div class="hero-actions">
            <button class="btn btn-light btn-lg" type="button" data-action="camera"><svg class="icon"><use href="#i-camera"/></svg><span data-i18n="take_photo"></span></button>
            <button class="btn btn-dark-outline btn-lg" type="button" data-action="example"><svg class="icon"><use href="#i-file"/></svg><span data-i18n="see_example"></span></button>
          </div>
        </div>
      </section>
    </section>

    <!-- Review photos and hide private info -->
    <section class="view" id="view-review" hidden>
      <div class="wrap narrow">
        <button class="back-btn" type="button" data-action="home"><svg class="icon flip-rtl"><use href="#i-arrow-left"/></svg><span data-i18n="back"></span></button>
        <p class="notice notice-info example-only"><svg class="icon"><use href="#i-info"/></svg><span data-i18n="example_banner"></span></p>
        <h1 data-i18n="review_title"></h1>
        <p class="lead" data-i18n="review_sub"></p>
        <div id="pages" class="pages"></div>
        <button class="btn btn-secondary btn-block" type="button" data-action="add-page" id="add-page-btn">
          <svg class="icon"><use href="#i-plus"/></svg><span data-i18n="add_page"></span>
        </button>
        <div class="sticky-cta">
          <button class="btn btn-primary btn-lg btn-block" type="button" data-action="explain" id="explain-btn">
            <span class="spinner" aria-hidden="true"></span><span id="explain-label"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- Waiting for the AI -->
    <section class="view" id="view-loading" hidden>
      <div class="wrap narrow loading">
        <div class="loading-letter" aria-hidden="true"><canvas id="loading-canvas"></canvas><div class="scan-line"></div></div>
        <h1 data-i18n="loading_title"></h1>
        <ol class="progress" aria-live="polite">
          <li data-step="1"><span class="progress-dot"></span><span data-i18n="step1"></span></li>
          <li data-step="2"><span class="progress-dot"></span><span data-i18n="step2"></span></li>
          <li data-step="3"><span class="progress-dot"></span><span data-i18n="step3"></span></li>
        </ol>
        <p class="muted" data-i18n="loading_note"></p>
      </div>
    </section>

    <!-- The explanation -->
    <section class="view" id="view-result" hidden>
      <div class="wrap narrow" id="result"></div>
    </section>

    <!-- Reply helper -->
    <section class="view" id="view-reply" hidden>
      <div class="wrap narrow wide-on-desktop">
        <button class="back-btn" type="button" data-action="to-result"><svg class="icon flip-rtl"><use href="#i-arrow-left"/></svg><span data-i18n="back"></span></button>
        <h1 data-i18n="reply_title"></h1>
        <p class="lead" data-i18n="reply_sub"></p>
        <label class="field-label" for="reply-note" data-i18n="reply_label"></label>
        <textarea id="reply-note" class="textarea" rows="3" maxlength="1000" data-i18n-attr="placeholder: reply_placeholder"></textarea>
        <ul class="chips chips-buttons">
          <li><button type="button" data-action="chip" data-i18n="chip_more_time"></button></li>
          <li><button type="button" data-action="chip" data-i18n="chip_already_sent"></button></li>
          <li><button type="button" data-action="chip" data-i18n="chip_disagree"></button></li>
          <li><button type="button" data-action="chip" data-i18n="chip_questions"></button></li>
        </ul>
        <button class="btn btn-primary btn-lg btn-block" type="button" data-action="write-reply" id="write-reply-btn">
          <span class="spinner" aria-hidden="true"></span><svg class="icon"><use href="#i-pen"/></svg><span id="write-reply-label"></span>
        </button>
        <div id="reply-output" aria-live="polite"></div>
      </div>
    </section>

    <!-- Errors -->
    <section class="view" id="view-error" hidden>
      <div class="wrap narrow error-view">
        <div class="error-art" aria-hidden="true"><svg class="icon"><use href="#i-alert"/></svg></div>
        <h1 data-i18n="err_title"></h1>
        <p class="lead" id="error-message"></p>
        <div class="stack">
          <button class="btn btn-primary btn-block" type="button" data-action="retry" id="retry-btn"><svg class="icon"><use href="#i-refresh"/></svg><span data-i18n="try_again"></span></button>
          <button class="btn btn-secondary btn-block" type="button" data-action="example"><svg class="icon"><use href="#i-file"/></svg><span data-i18n="try_example"></span></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-card">
        <div class="footer-top">
          <p class="footer-brand"><svg class="icon"><use href="#i-mail"/></svg>Open Letter</p>
          <div class="footer-cols">
            <div>
              <p class="footer-head" data-i18n="footer_app"></p>
              <ul>
                <li><button type="button" data-action="example" data-i18n="see_example"></button></li>
                <li><button type="button" data-action="camera" data-i18n="take_photo"></button></li>
              </ul>
            </div>
            <div>
              <p class="footer-head" data-i18n="footer_project"></p>
              <ul>
                <li><a href="https://github.com/Sheila-Sil/open-letter" target="_blank" rel="noopener" data-i18n="footer_source"></a></li>
                <li><a href="https://github.com/Sheila-Sil/open-letter/issues" target="_blank" rel="noopener" data-i18n="report_problem"></a></li>
              </ul>
            </div>
            <div>
              <p class="footer-head" data-i18n="footer_languages"></p>
              <ul id="footer-langs"></ul>
            </div>
          </div>
        </div>
        <p class="footer-note" data-i18n="footer"></p>
      </div>
    </div>
  </footer>

  <dialog id="lang-dialog" aria-labelledby="lang-dialog-title">
    <div class="dialog-head">
      <h2 id="lang-dialog-title" data-i18n="choose_language"></h2>
      <button class="icon-btn" type="button" data-action="close-lang" data-i18n-attr="aria-label: close"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <ul class="lang-list" id="lang-list"></ul>
  </dialog>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-library" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="print-area" class="print-only"></div>
</body>
</html>
